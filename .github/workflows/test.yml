name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Bash 4+ and bats-core
        run: brew install bash bats-core

      - name: Run test suite
        run: /opt/homebrew/bin/bash tests/run_tests.sh
